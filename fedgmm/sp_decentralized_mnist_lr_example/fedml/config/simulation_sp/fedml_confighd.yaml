############### For CIFAR 10 ###############
common_args:
  training_type: "simulation"
  using_mlops: false
  random_seed: 5
  config_version: "release"
  mlops_api_key: f5b88f5dca344e6faf17809139b89c48
  mlops_project_name: sp_fedavg_test
  mlops_run_name: fedml_torch_fedavg_mnist_lr

data_args:
  # dataset: "cifar10_xz"
  dataset: "femnist_xz"
  # dataset: "abs"
  data_cache_dir: "data"
  partition_method: "hetero"
  partition_alpha: 0.5

model_args:
  model: "lr"

train_args: #SGDA-Best working
  federated_optimizer: "FedAvg"
  client_id_list: "[]"
  client_num_in_total: 1000
  client_num_per_round: 10
  comm_round: 1500
  epochs: 3
  batch_size: 256
  client_optimizer: ogda # for ogda 0.001 and 0.003 are too small lrs that are leading to Nans
  # client_optimizer: sgd
  learning_rate: 0.001 #0.001, same, 0.003 now 
  weight_decay: 0.05 #working well with larger weight decay (best wd-0.5)
  

