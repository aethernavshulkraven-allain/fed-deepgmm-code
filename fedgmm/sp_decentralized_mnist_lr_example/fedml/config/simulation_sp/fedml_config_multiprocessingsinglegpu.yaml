######TRYING MINIBATCHES

train_args: #OGDA-MINIBATCH
  federated_optimizer: "FedAvg"
  client_id_list: "[]"
  client_num_in_total: 1000
  client_num_per_round: 10
  # Physical GPU selection belongs in CUDA_VISIBLE_DEVICES. When one GPU
  # is exposed, it is logical GPU 0 inside Python and in this YAML.
  client_execution_mode: multiprocessingsinglegpu
  enable_multiprocessing: false
  multiprocessingsinglegpu_num_workers: 2
  multiprocessingsinglegpu_gpu_id: 0
  comm_round: 500
  epochs: 7
  batch_size: 256
  # client_optimizer: ogda
  # client_optimizer: sgd
  learning_rate: 0.001
  weight_decay: 0.1  #save file-prednew0_001wd0_1.npy critic multiplier was 10 and server_lr=1.5 weight decay 0.01 earlier
  # Two-phase server methods (choose one instead of ogda above):
  client_optimizer: fed_eg     # exact SGD correction at server look-ahead
  # client_optimizer: fed_zo_eg  # forward-only SPSA correction at look-ahead
  server_learning_rate: 1.5
  # null means use server_learning_rate for that phase.
  eg_predictor_server_lr: null
  eg_corrector_server_lr: null
  # Used only by fed_zo_eg; each direction costs two objective forwards.
  zo_mu: 0.001
  zo_num_directions: 1
# next try 0.03
validation_args:
  frequency_of_the_test: 5

device_args:
  using_gpu: true
  gpu_id: 0

comm_args:
  backend: "sp"

tracking_args:
  enable_tracking: false
   # When running on MLOps platform(open.fedml.ai), the default log path is at ~/.fedml/fedml-client/fedml/logs/ and ~/.fedml/fedml-server/fedml/logs/
  enable_wandb: false
  wandb_key: \"\"
  wandb_entity: fedml-ai
  wandb_project: simulation
  run_name: fedml_multiprocessingsinglegpu_abs_fed_eg
