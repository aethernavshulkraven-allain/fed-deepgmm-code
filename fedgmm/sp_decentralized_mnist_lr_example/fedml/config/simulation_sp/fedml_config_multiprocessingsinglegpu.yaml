############### For CIFAR 10 ###############
common_args:
  training_type: "simulation"
  using_mlops: false
  random_seed: 0
  config_version: "release"
  mlops_api_key: \"\"
  mlops_project_name: sp_fedavg_test
  mlops_run_name: fedml_torch_fedavg_mnist_lr

data_args:
  # dataset: "cifar10_xz"
  # dataset: "femnist_xz"
  dataset: "abs"
  data_cache_dir: "data"
  partition_method: "hetero"
  partition_alpha: 0.5

model_args:
  model: "lr"

